# Valori di baseline del progetto, distinti dalla logica applicativa.
# Sorgenti: RAD FR-03 per la freschezza, FR-07 e NFR-07 per l'allegato,
# SDD 4.5 per l'entropia del codice di tracking, SDD 3.3 per il raggio terrestre.
# Il percorso del bundle messaggi è una scelta di packaging, non un valore di policy.

aegis.accessibility.freshness-days=30
aegis.reports.max-attachment-megabytes=5
aegis.tracking.entropy-bits=128
aegis.tracking.alphabet=0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz
aegis.geo.earth-radius-metres=6371000
aegis.messages.base-path=it/aegis/adapter/web/messages
aegis.adapter.messages.base-path=it/aegis/adapter/messages

# Integrazioni esterne. I valori vuoti indicano una scelta non ancora fornita
# dalla distribuzione: endpoint, bucket, credenziali e directory della fonte
# devono essere assegnati in sede di distribuzione. Non sono ammessi valori
# predefiniti né provider inventati nel repository.

aegis.routing.base-url=
aegis.routing.token=
aegis.transit.source-directory=
aegis.storage.endpoint=
aegis.storage.bucket=
aegis.storage.object-prefix=staged
aegis.storage.token=
aegis.storage.allowed-content-types=image/jpeg,image/png,image/webp
