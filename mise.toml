# Fonti di verità delle versioni degli strumenti di sviluppo.
# Ogni versione è pinned: il Makefile non ripete numeri di versione e li risolve
# sempre tramite `mise exec`, così build e export DOCX usano la stessa toolchain.
# La configurazione applicativa non è qui: risiede in config/data.

[tools]
# JDK LTS richiesto dal sorgente Java (maven.compiler.release = 21).
java = "21.0.13+9.0.LTS"
# Maven per il reactor multi-modulo; 3.9.x è la linea stabile usata dalla build.
maven = "3.9.16"
# Node.js richiesto dal build frontend e dagli strumenti Mermaid per i documenti.
node = "24.22.3"
# Pandoc per la conversione Markdown -> DOCX.
pandoc = "3.14"
# Container Servlet locale per provare le pagine e il WAR in sviluppo.
# Le implementazioni Faces, CDI e REST sono incluse nel WAR, perché Tomcat non è un server Jakarta EE completo.
tomcat = "11.0.29"
